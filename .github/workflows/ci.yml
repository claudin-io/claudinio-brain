name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Decides whether the rest of this file has anything to do. A README change
  # cannot break a build, and five toolchains plus an eval run is an expensive
  # way to prove it.
  #
  # This is deliberately *not* `paths-ignore` on the workflow. Six of these jobs
  # are required checks on main, and a workflow that never runs never reports
  # them -- they sit at "Expected -- waiting for status" and the pull request can
  # never be merged. A job skipped by an `if` condition does report, as skipped,
  # and branch protection accepts that as success. Same intent, opposite
  # mechanism, and only one of the two is a trap.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the base commit has to be in the clone to diff against
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "$BASE" ]; then
            files=$(git diff --name-only "$BASE" "$GITHUB_SHA")
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          else
            # A new branch, a tag, a manual run: nothing to compare against, so
            # assume code. Running a build that was not needed costs minutes;
            # skipping one that was needed costs a broken main.
            files=""
          fi

          if [ -z "$files" ]; then
            echo "no comparable base -- treating as code"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed files:"
          printf '%s\n' "$files" | sed 's/^/  /'

          # Everything that is not documentation. Testing the output for
          # emptiness rather than using `grep -q`: BSD grep returns 1 for `-qv`
          # even when the inverted match has lines, so `-q` here would behave one
          # way on the runner and the other way on the maintainer's laptop.
          code=$(printf '%s\n' "$files" | grep -vE '(\.md$|^docs/|^\.github/ISSUE_TEMPLATE/)' || true)
          if [ -n "$code" ]; then
            echo "not documentation:"
            printf '%s\n' "$code" | sed 's/^/  /'
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "documentation only -- skipping build, test and eval"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

  # The one job whose *steps* are gated instead of the job itself, and the
  # difference is not stylistic. A skipped job does not expand its matrix: all
  # four combinations collapse into a single check named `test`, and the three
  # required names -- `test (macos-latest, aarch64-apple-darwin)` and friends --
  # never report at all. The pull request then blocks forever, which is the exact
  # failure `changes` exists to avoid. Gating every step instead keeps the matrix
  # expanded and the names reporting, at the price of four runner starts doing
  # nothing for about five seconds each.
  test:
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          # Native, not emulated. Here because `c_char` is unsigned on aarch64
          # Linux and signed everywhere else in this matrix, so an FFI signature
          # can be wrong in a way no other target can see -- which is exactly how
          # `sqlite3_auto_extension` shipped broken for ARM servers until the
          # release build tried to compile it.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    env:
      RUN: ${{ needs.changes.outputs.code == 'true' }}
    steps:
      # Every step below is gated on RUN, so a RUN that failed to evaluate would
      # skip all of them and report a green job that tested nothing. That is the
      # worst outcome available here -- worse than a spurious failure, because
      # nobody investigates green. Assert the gate is one of the two values it is
      # allowed to be.
      - name: gate evaluated
        run: |
          case "${RUN:-}" in
            true | false) echo "changes gate: RUN=$RUN" ;;
            *) echo "::error::the changes gate did not evaluate (RUN='${RUN:-}')"; exit 1 ;;
          esac

      - if: env.RUN == 'true'
        uses: actions/checkout@v7
      - if: env.RUN == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: env.RUN == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # A C compiler is required (onig, bundled sqlite3, sqlite-vec). A C++ one is
      # deliberately not: see docs/stack-notes.md. musl needs its own cross gcc.
      - if: env.RUN == 'true' && endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # sqlite-vec.c:68-70 does `typedef u_int8_t uint8_t;` guarded only against
      # _WIN32, __EMSCRIPTEN__, __COSMOPOLITAN__ and __wasi__ -- so on musl it
      # fires, and musl does not declare the BSD spellings. Mapping them to the
      # standard names makes those three lines self-typedefs, which C11 permits.
      # (-D_GNU_SOURCE does not help: even with the BSD names declared, the
      # typedef still collides with stdint.h's uint8_t.) Those are the only three
      # occurrences of `u_int` in the file, so the substitution reaches nothing
      # else.
      - if: env.RUN == 'true' && endsWith(matrix.target, '-musl')
        run: |
          var="CFLAGS_$(echo '${{ matrix.target }}' | tr '-' '_')"
          echo "$var=-Du_int8_t=uint8_t -Du_int16_t=uint16_t -Du_int64_t=uint64_t" >> "$GITHUB_ENV"

      - if: env.RUN == 'true'
        run: cargo test --target ${{ matrix.target }}
      # The core must stay buildable without rmcp/tokio.
      - if: env.RUN == 'true'
        run: cargo check --target ${{ matrix.target }} --no-default-features

  eval:
    # Recall quality, gated on evals/baseline.json. Improving a number means
    # updating the baseline in the same commit, so it lands in the diff.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release --example eval

  msrv:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets
