name: Feature request
description: Suggest something brain should be able to do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem before the solution. The bitemporal model and the
        retrieval channels have opinions baked into them, and knowing what you
        were actually trying to do often changes the answer.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What were you trying to do, and where did brain get in the way?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: A command, a flag, a behaviour change. Rough is fine.

  - type: textarea
    id: eval
    attributes:
      label: If this is about recall quality, bring a case
      description: |
        A ranking argument without a case is unfalsifiable. One line of
        `evals/*.jsonl` is enough — the facts to load, the question, and which
        fact should come back.
      placeholder: |
        {"name":"...","facts":[{"id":"a","subject":"...","predicate":"...","num":1}],"query":"...","expect":["a"]}
      render: json

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Including "nothing, I stopped here" — that is useful to know.
